<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Looks Analysis (Safety-Aligned)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; padding: 24px; color: #111; background: #fafafa; }
    .container { max-width: 820px; margin: 0 auto; background: #fff; border: 1px solid #eaeaea; border-radius: 12px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
    h1 { font-size: 22px; margin: 0 0 16px; }
    p { color: #555; }
    form { display: grid; gap: 14px; }
    label { font-weight: 600; font-size: 14px; }
    input[type="text"], input[type="number"], textarea, select { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
    textarea { min-height: 90px; }
    input[type="file"] { font-size: 14px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .actions { display: flex; gap: 10px; align-items: center; }
    button { background: #111; color: #fff; border: none; border-radius: 8px; padding: 10px 14px; font-weight: 600; cursor: pointer; }
    button[disabled] { opacity: 0.6; cursor: not-allowed; }
    .result { white-space: pre-wrap; background: #fbfbfb; border: 1px solid #eee; border-radius: 8px; padding: 14px; }
    .notice { font-size: 12px; color: #666; }
    .error { color: #b00020; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Looks Analysis (Safety-Aligned)</h1>
    <p>Upload a clear, front-facing photo. Add details and goals for more tailored advice. Adult-only features (e.g., numeric rating, high-level discussion of procedures) require age 18+ and confirmation.</p>

    <form id="analyze-form">
      <div class="row">
        <div>
          <label for="age">Age</label>
          <input id="age" name="age" type="number" min="1" max="120" required />
        </div>
        <div>
          <label for="image">Photo</label>
          <input id="image" name="image" type="file" accept="image/*" required />
        </div>
      </div>

      <div class="row">
        <div>
          <label>
            <input id="consent_adult" name="consent_adult" type="checkbox" /> I confirm I am 18+
          </label>
        </div>
        <div>
          <label>
            <input id="wants_rating" name="wants_rating" type="checkbox" /> Request a 1-10 rating (18+ only)
          </label>
        </div>
      </div>

      <div class="row">
        <div>
          <label for="mode">Mode</label>
          <select id="mode" name="mode">
            <option value="safe" selected>Safe</option>
            <option value="edgy">Edgy (18+ only)</option>
          </select>
        </div>
        <div></div>
      </div>

      <div>
        <label for="goals">Goals (optional)</label>
        <textarea id="goals" name="goals" placeholder="e.g., clearer skin, sharper haircut, better jawline visibility, frame/gym focus"></textarea>
      </div>

      <div>
        <label for="notes">Notes (optional)</label>
        <textarea id="notes" name="notes" placeholder="Any extra context"></textarea>
      </div>

      <div class="actions">
        <button id="submitBtn" type="submit">Analyze</button>
        <span id="status" class="notice"></span>
      </div>

      <div id="error" class="error"></div>
      <div id="result" class="result" style="display:none"></div>
    </form>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
